<div class="dashboard-shell">
  <app-dashboard-sidebar [open]="menuOpen()" [userName]="auth.user()?.nombre ?? 'Usuario'" [role]="auth.user()?.rol ?? 'CONSULTA'" (logout)="auth.logout()" />
  @if (menuOpen()) { <button class="menu-backdrop" type="button" aria-label="Cerrar menu" (click)="closeMenu()"></button> }

  <div class="dashboard-workspace">
    @if (currentTournament(); as tournament) {
      <app-dashboard-topbar [tournamentName]="tournament.nombre" [tournaments]="tournaments()" [selectedTournamentId]="tournament.id" [userName]="auth.user()?.nombre ?? 'Usuario'" [role]="auth.user()?.rol ?? 'CONSULTA'" [menuOpen]="menuOpen()" (menuToggle)="toggleMenu()" (tournamentSelected)="changeTournament($event)" (createTournament)="openModule('torneos')" />
      <main class="dashboard-content">
        <app-world-cup-banner [tournament]="tournament" [hosts]="tournament.sede ? [tournament.sede] : []" [phase]="currentPhase()" [durationDays]="durationDays()" [dateRange]="dateRange()" [statusLabel]="formatTournamentStatus(tournament.estado)" />

        <section class="stats-grid" aria-label="Resumen del mundial">
          @for (stat of stats(); track stat.label) { <app-stat-card [icon]="stat.icon" [value]="stat.value" [label]="stat.label" [detail]="stat.detail" [tone]="stat.tone" /> }
        </section>

        <section class="dashboard-grid" [class.with-actions]="auth.isAdmin()" aria-label="Actividad del mundial">
          <app-upcoming-matches [matches]="upcomingMatches()" (openCalendar)="openModule('partidos')" />
          <app-dashboard-standings [groups]="standings()" (openFullTable)="openModule('clasificacion')" />
          <app-recent-results [matches]="recentMatches()" (openResults)="openModule('resultados')" />
          @if (auth.isAdmin()) {
            <app-quick-actions class="quick-actions-slot" (newTournament)="openModule('torneos')" (newTeam)="openModule('equipos')" (newMatch)="openModule('partidos')" (generateReport)="openModule('resultados')" />
          }
        </section>
      </main>
    } @else if (loading()) {
      <main class="loading-state"><span></span>Cargando resumen del mundial...</main>
    }
  </div>
</div>
